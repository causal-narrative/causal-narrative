[build-system]
requires = ["setuptools>=54", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-narrative"
dynamic = ["version"]
description = "A Python package for causal relation detection, extraction, and narrative analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "causal-narrative-team", email = "causalisnlp@gmail.com"}
]
keywords = ["NLP", "causality", "narrative", "semantic role labeling", "event clustering"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "nltk>=3.6",
    "spacy>=3.0",
    "scikit-learn>=1.0",
    "networkx>=2.6",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "sentence-transformers>=2.2.2",
    "hdbscan>=0.8.28",
    "loguru>=0.6",
    "tqdm>=4.62",
    "pydantic>=1.9,<3.0",
    "pyvis>=0.3.0",
    "openai>=1.0",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
allennlp = [
    "allennlp>=2.10",
    "allennlp-models>=2.10",
    "torch>=1.7.0,<1.13.0",
]

chinese = [
    "hanlp>=2.1",
    "jieba>=0.42",
]

viz = [
    "pyvis>=0.3.0",
    "playwright>=1.40",
    "nest-asyncio>=1.5",
]

dev = [
    "pytest>=6.0",
    "black>=22.0",
    "isort>=5.10",
    "pre-commit>=2.15",
    "pytest-cov>=3.0",
]

all = [
    "allennlp>=2.10",
    "allennlp-models>=2.10",
    "torch>=1.7.0,<1.13.0",
    "hanlp>=2.1",
    "jieba>=0.42",
    "pyvis>=0.3.0",
    "playwright>=1.40",
    "nest-asyncio>=1.5",
    "pytest>=6.0",
    "black>=22.0",
    "isort>=5.10",
]

[project.urls]
Homepage = "https://github.com/causal-narrative/causal-narrative"
Documentation = "https://github.com/causal-narrative/causal-narrative"
Repository = "https://github.com/causal-narrative/causal-narrative"
Changelog = "https://github.com/causal-narrative/causal-narrative/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "causal_narrative.__version__"}

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --doctest-modules --cov=causal_narrative"
testpaths = [
    "tests",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | __pycache__
  | \.egg-info
)/
'''

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["causal_narrative"]
skip_gitignore = true
