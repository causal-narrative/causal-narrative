[metadata]
name = causal-narrative
version = attr: causal_narrative.__version__
description = A Python package for causal relation detection, extraction, and narrative analysis
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/causalis-nlp/causal-narrative
author = causalis-nlp
author_email = causalisnlp@gmail.com
keywords = NLP, causality, narrative, semantic role labeling, event clustering
license = MIT License
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Text Processing :: Linguistic

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas>=1.3
    numpy>=1.21
    nltk>=3.6
    spacy>=3.0
    scikit-learn>=1.0
    networkx>=2.6
    matplotlib>=3.4
    seaborn>=0.11
    sentence-transformers>=2.2.2
    hdbscan>=0.8.28
    pdc-dp-means>=1.0
    loguru>=0.6
    tqdm>=4.62
    pydantic>=1.9,<3.0
    pyvis>=0.3.0
    openai>=1.0
    tenacity==9.1.4

[options.extras_require]
allennlp =
    allennlp>=2.10
    allennlp-models>=2.10
    torch>=1.7.0,<1.13.0

viz =
    pyvis>=0.3.0
    playwright>=1.40
    nest-asyncio>=1.5

dev =
    pytest>=6.0
    black>=22.0
    isort>=5.10
    pre-commit>=2.15

all =
    allennlp>=2.10
    allennlp-models>=2.10
    torch>=1.7.0,<1.13.0
    pyvis>=0.3.0
    playwright>=1.40
    nest-asyncio>=1.5
    pytest>=6.0
    black>=22.0
    isort>=5.10

[options.packages.find]
exclude =
    tests*
    docs*
    notebooks*
    output*
    model*
